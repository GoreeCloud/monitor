name: Validate GoreeCloud Monitor
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile service/monitor.py
      - name: Validate self-hosted Compose example
        env:
          MONITOR_API_TOKEN: ci-synthetic-only-this-is-not-a-secret
        run: docker compose -f deploy/compose.yaml config -q
  web:
    name: Web build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
  native:
    name: Native analyze and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  android:
    name: Android debug build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --debug
  linux:
    name: Linux desktop build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
      - run: flutter build linux
  containers:
    name: Container integration smoke
    runs-on: ubuntu-24.04
    env:
      MONITOR_API_TOKEN: ci-only-synthetic-strong-token-00000000000
    steps:
      - uses: actions/checkout@v4
      - name: Build self-hosted containers
        run: docker compose -f deploy/compose.yaml build
      - name: Start locally bound web + API
        run: docker compose -f deploy/compose.yaml up -d --wait
      - name: Confirm published status JSON
        run: curl --fail --silent --show-error http://127.0.0.1:8088/api/v1/status | python3 -c "import json,sys; data=json.load(sys.stdin); assert data['service']=='GoreeCloud Monitor'; assert data['summary']['total']==0"
      - name: Confirm web document
        run: curl --fail --silent --show-error http://127.0.0.1:8088/ | grep -q 'GoreeCloud Monitor'
      - name: Stop and remove synthetic data
        if: always()
        run: docker compose -f deploy/compose.yaml down -v
