name: Monitor validation
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python syntax
        run: python -m compileall -q monitor tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check web/app.js
      - name: Browser-independent service discovery and accessibility tests
        run: node --test tests/test_web_ui.mjs
      - name: Check secrets not committed
        run: |
          test ! -e secrets/admin_password.txt
          test ! -e .env

  container-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build standalone application image
        run: docker build --tag goreecloud-monitor:ci .
      - name: Check isolated container runtime and security boundaries
        run: python3 tests/container_smoke.py goreecloud-monitor:ci
