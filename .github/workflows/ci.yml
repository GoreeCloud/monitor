name: Monitor validation
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python -m compileall -q monitor tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check web/app.js
      - name: Browser-independent filter tests
        run: node --test tests/test_web_ui.mjs
      - name: Check secrets not committed
        run: |
          test ! -e secrets/admin_password.txt
          test ! -e .env
